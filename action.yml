---
# https://help.github.com/en/articles/metadata-syntax-for-github-actions
name: 'upload-artifact-retry'
description: "GitHub Action retry wrapper for upload-artifact-verify."
author: 'cytopia'
branding:
  icon: 'code'
  color: 'red'

inputs:
  name:
    description: 'The artifact name.'
    required: true
  path:
    description: 'The local file to upload.'
    required: true
  pre_command:
    description: 'A bash command to execute before uploading the artifact (e.g.: to create the artifact)'
    required: false
    default: ''
  post_command:
    description: 'A bash command to execute after downloading the artifact (e.g.: to verify it is the desired file)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:

    - name: upload-artifact-verify (try-1)
      id: upload-1
      uses: linuxeye/upload-artifact-verify-action@master
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        pre_command: ${{ inputs.pre_command }}
        post_command: ${{ inputs.post_command }}

    - name: Diagnose available artifacts
      if: steps.download-1.outcome == 'failure'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "::warning::Upload failed. Requested: ${{ inputs.name }}"
        echo "Available artifacts in run ${{ github.run_id }}:"
        gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
          --jq '.artifacts[] | "\(.id)  \(.name)  expired=\(.expired)"' \
          || echo "::warning::Failed to list artifacts. Ensure the token has 'actions: read' permission."

    - name: Wait before retry
      if: steps.upload-1.outcome == 'failure'
      run: sleep 30
      shell: bash

    - name: upload-artifact-verify (try-2)
      id: upload-2
      uses: linuxeye/upload-artifact-verify-action@master
      continue-on-error: true
      if: ${{ steps.upload-1.outcome == 'failure' }}
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        pre_command: ${{ inputs.pre_command }}
        post_command: ${{ inputs.post_command }}

    - name: Wait before retry
      if: steps.upload-2.outcome == 'failure'
      run: sleep 30
      shell: bash

    - name: upload-artifact-verify (try-3)
      id: upload-3
      uses: linuxeye/upload-artifact-verify-action@master
      continue-on-error: true
      if: ${{ steps.upload-2.outcome == 'failure' }}
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        pre_command: ${{ inputs.pre_command }}
        post_command: ${{ inputs.post_command }}
